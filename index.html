<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>지도원 QR 스캔</title>
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com">
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:#111;color:#fff}
  .wrap{max-width:480px;margin:0 auto;padding:12px}
  #reader{position:relative;width:100%;aspect-ratio:1/1;border-radius:12px;overflow:hidden;background:#000;display:none}
  #reader video{width:100%;height:100%;object-fit:cover;display:block}
  #reader .frame{position:absolute;inset:10%;border:3px solid rgba(255,255,255,.85);border-radius:12px}
  button{width:100%;padding:16px;font-size:18px;border:0;border-radius:12px;background:#2563eb;color:#fff;font-weight:700;margin-bottom:12px}
  button:disabled{opacity:.6}
  #result{margin:12px 0;padding:18px;border-radius:12px;text-align:center;background:#333;min-height:96px}
  #result .big{font-size:22px;font-weight:800}
  #result .course{font-size:36px;font-weight:900;line-height:1.25;margin:12px 0 8px;padding:12px 8px;background:rgba(0,0,0,.2);border-radius:10px;word-break:keep-all}
  #result .name{font-size:20px;font-weight:700;margin-top:4px}
  #result .sub{font-size:16px;margin-top:6px}
  #result.ok{background:#16a34a}
  #result.used{background:#ea580c}
  #result.period,#result.invalid,#result.auth{background:#dc2626}
  #alerts .al{background:#7f1d1d;border:2px solid #f87171;border-radius:12px;padding:12px;margin:8px 0;font-size:16px;line-height:1.5}
  #alerts .al small{display:block;color:#fca5a5;font-size:12px;margin-top:4px}
  #queueInfo{color:#fbbf24;font-size:14px;text-align:center;margin:4px 0}
  h2{font-size:16px;margin:20px 0 8px;color:#bbb}
  ul{list-style:none;padding:0;margin:0}
  li{padding:10px 12px;border-bottom:1px solid #333;font-size:16px}
  li small{display:block;color:#999;font-size:13px;margin-top:2px}
  li .pend{color:#fbbf24;font-size:12px;margin-left:6px}
  .small{background:#444;font-size:14px;padding:10px;margin-top:20px}
  #lock{max-width:480px;margin:0 auto;padding:80px 24px}
  #lock h1{text-align:center;font-size:22px;margin-bottom:24px}
  #lock input{width:100%;padding:16px;font-size:22px;text-align:center;border-radius:12px;border:0;margin-bottom:12px;letter-spacing:6px}
  #pinMsg{color:#f87171;text-align:center;min-height:22px}
  .hidden{display:none}
</style>
</head>
<body>

<div id="lock">
  <h1>🔒 지도원 PIN 입력</h1>
  <input id="pinInput" type="password" inputmode="numeric" placeholder="PIN" autocomplete="off">
  <button id="pinBtn">확인</button>
  <div id="pinMsg"></div>
</div>

<div id="main" class="wrap hidden">
  <button id="start">📷 스캔 시작</button>
  <div id="reader"><video id="video" playsinline muted></video><div class="frame"></div></div>
  <div id="result"><div class="big">QR을 스캔해 주세요</div></div>
  <div id="alerts"></div>
  <div id="queueInfo"></div>
  <h2>오늘 확인 목록 <span id="count"></span></h2>
  <ul id="today"></ul>
  <button id="logout" class="small">로그아웃 (PIN 다시 입력)</button>
</div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbzak8nUZCw9rXO-_dXclDIi7gfujD3rXkOiDZE2f_LLT0YQ9U-Fs4F1kEqhOnKqplAU/exec';

const $ = id => document.getElementById(id);
let PIN = '';                 // 폰에 저장하지 않고 메모리에만 보관
let busy = false, lastCode = '', lastAt = 0, timer = null;
let roster = new Map();       // 해시 → 학생/강의 정보
let used = new Map();         // 해시 → 확인 시각 (오늘)
let listData = [];            // 화면 목록
let queue = [];               // 서버 전송 대기
let showingH = null, rosterAt = 0, lastApplied = 0;
let stream = null, detector = null, scanning = false;
const SIZE = 480;
const canvas = document.createElement('canvas');
canvas.width = SIZE; canvas.height = SIZE;
const ctx = canvas.getContext('2d', { willReadFrequently: true });

/* ---------- 공통 ---------- */
function kstNow() {
  const d = new Date();
  return {
    date: d.toLocaleDateString('sv-SE', { timeZone: 'Asia/Seoul' }),
    time: d.toLocaleTimeString('en-GB', { timeZone: 'Asia/Seoul', hour: '2-digit', minute: '2-digit' })
  };
}
async function hashHex(s) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('').slice(0, 32);
}
function vib(ok) { if (navigator.vibrate) navigator.vibrate(ok ? 120 : [200, 80, 200]); }

 // 대기 기록을 폰에 백업
function saveQueue() {
  if (!PIN) return; // 로그아웃 상태에서는 백업을 덮어쓰지 않음
  try {
    localStorage.setItem('pendingQueue', JSON.stringify(queue.map(q => (
      { code: q.code, h: q.h, name: q.name, course: q.course, time: q.time, date: q.date }))));
  } catch (e) {}
}
// 다음 로그인 때 백업된 기록 복구
function restoreQueue() {
  let saved = [];
  try { saved = JSON.parse(localStorage.getItem('pendingQueue') || '[]'); } catch (e) {}
  const today = kstNow().date;
  const old = saved.filter(q => q.date !== today);
  saved.filter(q => q.date === today && !queue.some(x => x.h === q.h))
       .forEach(q => queue.push(Object.assign(q, { tries: 1 })));
  if (old.length) addAlert(`⚠️ 지난 날짜에 기록되지 못한 ${old.length}건 (관리자가 시트에 직접 입력 필요): ` +
    old.map(q => `${q.name} ${q.course} (${q.date} ${q.time})`).join(', '));
  saveQueue();
}
// 페이지가 닫히는 순간 남은 기록 전송
function beaconQueue() {
  if (!PIN || !queue.length || !navigator.sendBeacon) return;
  queue.forEach(q => {
    navigator.sendBeacon(API_URL, JSON.stringify({ pin: PIN, action: 'scan', code: q.code, tm: q.time }));
    q.tries = Math.max(q.tries || 0, 1);
  });
}

async function call(params) {
  params.pin = PIN;
  params.t = Date.now();
  const res = await fetch(API_URL + '?' + new URLSearchParams(params));
  const j = await res.json();
  if (j.type === 'auth') lock('PIN이 올바르지 않습니다.');
  return j;
}

/* ---------- PIN 잠금 ---------- */
function lock(msg) {
  PIN = '';
  stopScan();
  if (timer) { clearInterval(timer); timer = null; }
  roster = new Map(); used = new Map(); listData = []; queue = []; lastApplied = 0;
  $('alerts').innerHTML = ''; $('queueInfo').textContent = '';
  $('main').classList.add('hidden');
  $('lock').classList.remove('hidden');
  $('start').style.display = ''; $('start').disabled = false;
  $('pinInput').value = '';
  $('pinMsg').textContent = msg || '';
}

async function loadInit() {
  const t0 = Date.now();
  const r = await call({ action: 'init' });
  if (r.ok) {
    roster = new Map(r.roster.map(x => [x.h, x]));
    rosterAt = Date.now();
    applyServerList(r.list, t0);
  }
  return r;
}

async function tryPin(pin) {
  if (!pin) { $('pinMsg').textContent = 'PIN을 입력해 주세요.'; return; }
  $('pinBtn').disabled = true;
  $('pinMsg').textContent = '명단 불러오는 중...';
  PIN = pin;
  try {
    const r = await loadInit();
    if (r.ok) {
      $('lock').classList.add('hidden');
      $('main').classList.remove('hidden');
      timer = setInterval(sync, 15000);
      restoreQueue(); loadToday(); flushQueue();
    } else if (r.type !== 'auth') {
      $('pinMsg').textContent = r.msg || '오류가 발생했습니다.';
    }
  } catch (e) {
    $('pinMsg').textContent = '네트워크 오류입니다. 다시 시도해 주세요.';
  }
  $('pinBtn').disabled = false;
}

/* ---------- 목록 동기화 ---------- */
function applyServerList(list, issuedAt) {
  if (!list || issuedAt < lastApplied) return; // 오래된 응답은 무시
  lastApplied = issuedAt;
  used = new Map(list.map(x => [x.h, x.time]));
  const pend = queue.filter(q => !used.has(q.h));
  pend.forEach(q => used.set(q.h, q.time));
  listData = pend.slice().reverse()
    .map(q => ({ h: q.h, name: q.name, course: q.course, time: q.time, pending: true }))
    .concat(list);
  renderList();
}

function renderList() {
  $('count').textContent = `(${listData.length}건)`;
  const ul = $('today'); ul.innerHTML = '';
  listData.forEach(x => {
    const li = document.createElement('li');
    const a = document.createElement('div');
    a.textContent = `${x.name} (${x.time} 확인)`;
    if (x.pending) { const p = document.createElement('span'); p.className = 'pend'; p.textContent = '⏳ 기록 중'; a.appendChild(p); }
    const b = document.createElement('small');
    b.textContent = x.course;
    li.append(a, b); ul.appendChild(li);
  });
  $('queueInfo').textContent = queue.length ? `⏳ 서버 기록 대기 ${queue.length}건` : '';
}

async function loadToday() {
  const t0 = Date.now();
  try { const r = await call({ action: 'today' }); if (r.ok) applyServerList(r.list, t0); } catch (e) {}
}

function flushQueue() { queue.forEach(sendOne); }

function sync() {
  flushQueue();
  if (Date.now() - rosterAt > 600000) loadInit().catch(() => {}); // 10분마다 명단 갱신
  else loadToday();
}

function addAlert(text) {
  const d = document.createElement('div'); d.className = 'al';
  d.textContent = text;
  const s = document.createElement('small'); s.textContent = '눌러서 닫기';
  d.appendChild(s);
  d.onclick = () => d.remove();
  $('alerts').prepend(d);
}

/* ---------- 결과 표시 ---------- */
function showResult(r) {
  const el = $('result');
  el.className = r.type || '';
  el.innerHTML = '';
  const titles = { ok: '✅ 확인 완료', used: '⚠️ 이미 확인 처리됨', period: '❌ 수강 기간 아님',
                   invalid: '❌ 확인 불가', auth: '🔒 PIN 오류', loading: '확인 중...' };
  const big = document.createElement('div'); big.className = 'big';
  big.textContent = titles[r.type] || '';
  el.appendChild(big);
  if (r.course) { const c = document.createElement('div'); c.className = 'course'; c.textContent = r.course; el.appendChild(c); }
  if (r.name) { const n = document.createElement('div'); n.className = 'name'; n.textContent = r.name; el.appendChild(n); }
  if (r.msg && r.type !== 'loading') { const s = document.createElement('div'); s.className = 'sub'; s.textContent = r.msg; el.appendChild(s); }
}

/* ---------- 스캔 처리: 폰에서 즉시 판정 → 서버는 뒤에서 기록 ---------- */
async function onScan(text) {
  const now = Date.now();
  if (busy || (text === lastCode && now - lastAt < 4000)) return;
  busy = true; lastCode = text; lastAt = now;
  try {
    const h = await hashHex(text);
    const info = roster.get(h);
    if (!info) { showingH = null; await serverScan(text); return; } // 명단에 없으면 서버에 직접 확인

    showingH = h;
    const k = kstNow();
    const base = { name: info.n, course: info.c };

    if ((info.s && k.date < info.s) || (info.e && k.date > info.e)) {
      showResult(Object.assign({ type: 'period', msg: `수강 기간: ${info.s} ~ ${info.e}` }, base));
      vib(false); return;
    }
    if (used.has(h)) {
      showResult(Object.assign({ type: 'used', msg: `${used.get(h)}에 이미 확인됨` }, base));
      vib(false); return;
    }

    // 즉시 통과 표시
    used.set(h, k.time);
    const item = { code: text, h, name: info.n, course: info.c, time: k.time, date: k.date, tries: 0 };
    queue.push(item);
    saveQueue();

    listData.unshift({ h, name: info.n, course: info.c, time: k.time, pending: true });
    renderList();
    showResult(Object.assign({ type: 'ok', msg: `${k.time} 확인` }, base));
    vib(true);
    sendOne(item);
  } finally {
    setTimeout(() => busy = false, 300);
  }
}

async function sendOne(item) {
  if (item.sending) return;
  item.sending = true;
  const t0 = Date.now();
  try {
    const r = await call({ action: 'scan', code: item.code, tm: item.time });
    if (r.type === 'auth') return;
    queue = queue.filter(q => q !== item);
    saveQueue();

    // 이전 전송이 실제로는 성공했는데 응답만 못 받은 경우는 정상으로 처리
    const mine = r.type === 'used' && r.time === item.time && item.tries > 0;
    if (!r.ok && !mine) {
      if (showingH === item.h) showResult(r);
      addAlert(`⚠️ ${item.name} · ${item.course} — ${r.msg || '확인 불가'} (다른 지도원이 먼저 처리했을 수 있음)`);
      vib(false);
    }
    if (r.list) applyServerList(r.list, t0);
    else {
      listData = listData.filter(x => !(x.pending && x.h === item.h));
      used.delete(item.h);
    }
  } catch (e) {
    item.tries++; // 네트워크 오류 → 대기열에 남겨두고 다음 동기화 때 재시도
  } finally {
    item.sending = false;
    renderList();
  }
}

async function serverScan(text) {
  showResult({ type: 'loading' });
  const t0 = Date.now();
  try {
    const r = await call({ action: 'scan', code: text });
    if (r.type === 'auth') return;
    showResult(r); vib(r.ok);
    if (r.list) applyServerList(r.list, t0);
    if (r.ok) loadInit().catch(() => {}); // 새로 추가된 학생이면 명단 갱신
  } catch (e) {
    showResult({ type: 'invalid', msg: '네트워크 오류입니다. 다시 스캔해 주세요.' });
  }
}

/* ---------- 카메라 / QR 인식 (반전 QR 지원) ---------- */
async function startScan() {
  stream = await navigator.mediaDevices.getUserMedia({
    audio: false,
    video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }
  });
  const v = $('video');
  v.srcObject = stream;
  await v.play();
  $('reader').style.display = 'block';
  detector = null;
  if ('BarcodeDetector' in window) {
    try {
      const f = await BarcodeDetector.getSupportedFormats();
      if (f.includes('qr_code')) detector = new BarcodeDetector({ formats: ['qr_code'] });
    } catch (e) {}
  }
  scanning = true;
  loop();
}

function stopScan() {
  scanning = false;
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  const r = $('reader'); if (r) r.style.display = 'none';
}

async function decodeFrame(v) {
  const vw = v.videoWidth, vh = v.videoHeight;
  if (!vw || !vh) return null;
  const s = Math.min(vw, vh) * 0.8, sx = (vw - s) / 2, sy = (vh - s) / 2;
  ctx.drawImage(v, sx, sy, s, s, 0, 0, SIZE, SIZE);
  if (detector) {
    try { const codes = await detector.detect(canvas); if (codes.length) return codes[0].rawValue; } catch (e) {}
  }
  const img = ctx.getImageData(0, 0, SIZE, SIZE);
  const r = jsQR(img.data, SIZE, SIZE, { inversionAttempts: detector ? 'onlyInvert' : 'attemptBoth' });
  return r ? r.data : null;
}

async function loop() {
  if (!scanning) return;
  const v = $('video');
  if (!busy && v.readyState >= 2) {
    try { const text = await decodeFrame(v); if (text) onScan(text.trim()); } catch (e) {}
  }
  setTimeout(loop, 80);
}

$('start').onclick = async () => {
  const btn = $('start'); btn.disabled = true;
  try {
    await startScan();
    btn.style.display = 'none';
  } catch (e) {
    stopScan();
    btn.disabled = false;
    showResult({ type: 'invalid', msg: '카메라를 켤 수 없습니다. 브라우저의 카메라 권한을 허용해 주세요.' });
  }
};

document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    beaconQueue(); // 다른 앱으로 넘어가면 바로 전송
    if (scanning) { stopScan(); $('start').style.display = ''; $('start').disabled = false; }
  } else {
    flushQueue();
  }
});
window.addEventListener('pagehide', beaconQueue);
window.addEventListener('beforeunload', e => {
  if (queue.length) { e.preventDefault(); e.returnValue = ''; } // 가능한 브라우저에서 경고창
});

window.addEventListener('online', flushQueue);

$('pinBtn').onclick = () => tryPin($('pinInput').value.trim());
$('pinInput').addEventListener('keydown', e => { if (e.key === 'Enter') tryPin($('pinInput').value.trim()); });
$('logout').onclick = () => {
  if (queue.length && !confirm(`아직 서버에 기록되지 않은 ${queue.length}건이 있습니다. 로그아웃할까요?`)) return;
  lock('');
};

localStorage.removeItem('staffPin');
lock('');
</script>
</body>
</html>
